<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Span Survival</title>
<style>
:root{--ink:#4a3f55;--muted:#7a6c85;--paper:#f6ecf5;--dot:#e6d6ea;--pink:#ffb7c9;--yellow:#ffeaa7;--mint:#b5ead7;--blue:#b8e0f6;--lilac:#e8dcf8;--white:#fff;--px:'Press Start 2P','Courier New',ui-monospace,Menlo,monospace;--vt:'VT323',ui-monospace,'SF Mono',Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:#050605;padding:32px 16px;font-family:var(--vt);font-size:20px;line-height:1.25;color:var(--ink)}
.page{max-width:1180px;margin:0 auto;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:16px 16px;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:32px 28px 40px;position:relative}
h1{font-family:var(--px);font-size:clamp(18px,3.2vw,30px);line-height:1.4;margin:0;text-shadow:4px 4px 0 var(--pink)}
h2{font-family:var(--px);font-size:13px;margin:0 0 6px}
.tag{margin:12px 0 4px;font-size:24px;color:var(--muted)}
.def{color:var(--muted);margin-bottom:10px}
.demo{display:inline-block;background:var(--yellow);border:3px solid var(--ink);padding:4px 10px;margin:8px 0 6px}
.desc{color:var(--muted);margin:0 0 12px;max-width:900px}
section{margin-top:34px}
.star{position:absolute;color:#cdb4f6;animation:twinkle 2.4s infinite}
.card{background:var(--white);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px}
.cards{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;gap:16px}
.cards .card{animation:rise .5s both}
.settled .rise,.settled .cards .card{animation:none}
.big{background:var(--pink);box-shadow:5px 5px 0 var(--ink)}
.big .v{font-family:var(--px);font-size:clamp(24px,4vw,44px);margin:14px 0 10px}
.v{font-family:var(--px);font-size:16px;margin:12px 0}
.k,.n{color:var(--muted)}
.yellow{background:var(--yellow)}
.mint{background:var(--mint)}
.pick{cursor:pointer;transition:transform .12s,box-shadow .12s}
.pick:hover{transform:translate(-2px,-3px);box-shadow:6px 7px 0 var(--ink)}
.pick:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.off{opacity:.55}
.seg{display:flex;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.btn{cursor:pointer;padding:2px 12px;border:3px solid var(--ink);background:var(--white);font:inherit;color:inherit}
.btn.on{background:var(--yellow)}
.btn:hover{transform:translateY(-2px)}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:28px}
.panel{background:var(--white);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px}
svg{width:100%;height:auto;display:block;overflow:visible}
.line{fill:none;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1000;animation:draw 1.6s ease-out both;transition:opacity .3s}
.mark{transition:transform .4s}
.stack{display:flex;height:34px;border:3px solid var(--ink);margin:4px 0 16px;overflow:hidden}
.part{padding:4px 6px;overflow:hidden;white-space:nowrap;border-right:3px solid var(--ink);transform-origin:left;animation:grow .9s ease-out both}
.part:last-child{border-right:0}
.slices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.chip{background:var(--lilac);padding:0 6px;display:inline-block;margin-bottom:6px}
.r{margin-top:8px}
.r .t{display:flex;justify-content:space-between}
.track{height:14px;border:2px solid var(--ink);background:var(--paper)}
.fill{height:100%;background:var(--mint);transform-origin:left;animation:grow .9s ease-out both}
.few .fill{background:#d9d2e0}
.few{opacity:.7}
.sub{color:#9a8da5;font-size:17px}
.ex{display:grid;grid-template-columns:64px 1fr 80px 52px;gap:8px;padding:8px 14px;border-bottom:2px solid #f0e4f0}
.ex:hover{background:var(--yellow)}
.ex .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.best{color:#2f8f6b}
.worst{color:#c0504d}
.blocks{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;margin-bottom:10px}
.bl{display:flex;gap:3px}
.bl i{flex:1;height:18px;background:#cdb4f6;border:2px solid var(--ink)}
.quality{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.quality .card{background:var(--blue);transition:transform .15s}
.quality .card:hover{transform:translateY(-4px) rotate(-1deg)}
.note{margin-top:14px;color:var(--muted);max-width:900px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-width:820px){.cards,.two{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page" id="app">
<span class="star" style="right:40px;top:22px">✦</span>
<span class="star" style="right:120px;top:44px;color:var(--pink);animation-delay:.6s">✦</span>
<h1>SPAN SURVIVAL<br>ANALYSIS</h1>
__DEMO_BANNER__
<div class="tag">How much of the code AI writes is still there later, and why the rest disappears.</div>
<div class="def">A span is a stretch of bytes an AI wrote.</div>
<div id="s01"></div>
<div id="s02"></div>
<div id="s03"></div>
<div id="s04"></div>
<div id="s05"></div>
<div id="s06"></div>
<div id="s07"></div>
</div>
<script id="report" type="application/json">__REPORT_JSON__</script>
<script id="view" type="application/json">__VIEW_JSON__</script>
<script>
const R = JSON.parse(document.getElementById('report').textContent);
const V = JSON.parse(document.getElementById('view').textContent);
const HZ = ['24h', '7d', '30d'];
const DAYS = { '24h': 1, '7d': 7, '30d': 30 };
const ANCHORS = [['commit', 'from commit', '#7fb8e8'], ['generation', 'from generation', '#f29bb5']];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const state = { anchor: V.anchor, hz: V.horizon, show: { commit: true, generation: true } };
const LABELS = {
  relationship: { ai: 'AI code', known_human: 'human code', untracked: 'untracked text', none: 'fresh addition' },
  edit_type: { add: 'added', replace: 'replaced' },
  tool: { file_edit: 'file edit' },
  model_effort: {}
};
const DIMS = [['relationship', 'what it replaced'], ['edit_type', 'edit type'], ['tool', 'tool'], ['model_effort', 'model · effort']];
const WHO = { ai: ['AI', '#9fd0f5'], known_human: ['known human', '#ffd59e'], untracked: ['untracked', '#d9d2e0'] };
const HOW = { replace: ['replaced', '#9fd0f5'], delete: ['deleted', '#f7a9a8'] };
const TOO_FEW = 10;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pct = f => Math.round(f * 100) + '%';
const count = n => Math.round(n).toLocaleString('en-US');
const bytes = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(1) + ' GB';
const rowAt = (anchor, hz) => R.horizons.find(r => r.anchor === anchor && r.horizon === hz);
const label = (dim, raw) => (LABELS[dim] && LABELS[dim][raw]) || raw;
const head = (n, title, desc) => `<h2>${n} ${title}</h2><p class="desc">${desc}</p>`;

function s01() {
  const row = rowAt(state.anchor, state.hz);
  const alive = R.totals.bytes_written ? pct(R.totals.bytes_alive / R.totals.bytes_written) : '–';
  const others = HZ.filter(h => h !== state.hz).map(h => {
    const r = rowAt(state.anchor, h);
    return r
      ? `<div class="card pick" data-hz="${h}"><div class="k">RET @ ${h}</div><div class="v">${pct(r.retention)}</div><div class="n">n=${count(r.spans)} spans</div></div>`
      : `<div class="card off"><div class="k">RET @ ${h}</div><div class="v">–</div><div class="n">not yet</div></div>`;
  }).join('');
  const empty = R.horizons.length ? '' : '<p class="note">No code has reached an age yet. The first row appears 24 hours after code is written.</p>';
  const seg = ANCHORS.map(([a, name]) => `<button class="btn ${a === state.anchor ? 'on' : ''}" data-anchor="${a}">${name}</button>`).join('');
  return head('01', 'HOW MUCH SURVIVES', 'Of the bytes AI wrote, the share still in the code after 24 hours, 7 days and 30 days. Each age counts only code that old. Click an age to switch.')
    + `<div class="seg">${seg}</div>`
    + `<div class="cards">`
    + `<div class="card big"><div>RETENTION @ ${state.hz.toUpperCase()}</div><div class="v" id="big" data-target="${row ? Math.round(row.retention * 100) : ''}">${row ? '0%' : '–'}</div><div>${row ? 'n=' + count(row.spans) + ' spans' : 'not yet'}</div></div>`
    + `<div class="card yellow"><div class="k">AI BYTES WRITTEN</div><div class="v">${bytes(R.totals.bytes_written)}</div><div class="n">n=${count(R.totals.spans)} spans</div></div>`
    + `<div class="card mint"><div class="k">STILL THERE NOW</div><div class="v">${alive}</div><div class="n">all ages</div></div>`
    + others + `</div>${empty}`;
}

function xOf(days) { return 600 * days / 30; }
function yOf(r) { return (1 - r) * 200; }
function points(anchor) {
  const rows = HZ.map(h => rowAt(anchor, h)).filter(Boolean);
  return rows.length ? [[0, 1]].concat(rows.map(r => [xOf(DAYS[r.horizon]), r.retention])) : [];
}
function s02() {
  const lines = ANCHORS.map(([a, , color]) => {
    const pts = points(a);
    if (!pts.length) return '';
    const poly = pts.map(([x, r]) => `${x},${yOf(r)}`).join(' ');
    const dots = pts.slice(1).map(([x, r]) => `<rect x="${x - 5}" y="${yOf(r) - 5}" width="10" height="10" fill="${color}" stroke="#4a3f55" stroke-width="2"/>`).join('');
    return `<g id="line-${a}" style="opacity:${state.show[a] ? 1 : .08};transition:opacity .3s"><polyline class="line" points="${poly}" stroke="${color}" pathLength="1000"/>${dots}</g>`;
  }).join('');
  const any = ANCHORS.some(([a]) => points(a).length);
  const grid = [0, 100, 200].map(y => `<line x1="0" y1="${y}" x2="600" y2="${y}" stroke="#e6d6ea" stroke-width="2"/>`).join('');
  const ylab = [['100%', 0], ['50%', 100], ['0%', 200]].map(([t, y]) => `<text x="-10" y="${y + 6}" text-anchor="end" fill="#7a6c85" font-size="16">${t}</text>`).join('');
  const xlab = [['0', 0], ['24h', xOf(1)], ['7d', xOf(7)], ['30d', xOf(30)]].map(([t, x]) => `<text x="${x}" y="228" text-anchor="middle" fill="#7a6c85" font-size="16">${t}</text>`).join('');
  const none = any ? '' : '<text x="300" y="100" text-anchor="middle" fill="#7a6c85" font-size="20">not yet</text>';
  const toggles = ANCHORS.map(([a, name, color]) => `<button class="btn ${state.show[a] ? 'on' : ''}" data-line="${a}" style="border-color:#4a3f55"><span style="color:${color}">■</span> ${name}</button>`).join('');
  return head('02', 'SURVIVAL CURVE', 'How the share of AI bytes still present changes as code ages. Blue starts the clock at commit; pink starts it when the code was written, and includes code never committed. Click a name to hide a line.')
    + `<div class="panel"><svg viewBox="0 0 680 244"><g transform="translate(56,12)">${grid}${ylab}${xlab}${lines}${none}<g class="mark" id="mark" style="transform:translate(0,0);opacity:0"><rect x="-10" y="-10" width="20" height="20" fill="#ffeaa7" stroke="#4a3f55" stroke-width="3"/></g></g></svg><div class="seg" style="margin:8px 0 0">${toggles}</div></div>`;
}
function moveMark() {
  const mark = document.getElementById('mark');
  const r = rowAt(state.anchor, state.hz);
  if (!mark) return;
  if (!r) { mark.style.opacity = 0; return; }
  mark.style.opacity = 1;
  mark.style.transform = `translate(${xOf(DAYS[state.hz])}px,${yOf(r.retention)}px)`;
}

function stack(rows, names) {
  const total = rows.reduce((s, r) => s + r.bytes, 0);
  return `<div class="stack">${rows.map(r => {
    const [name, color] = names[r.kind] || [r.kind, '#d9d2e0'];
    const w = Math.round(r.bytes / total * 100);
    const text = w >= 28 ? `${esc(name)} ${w}%` : w >= 14 ? `${w}%` : '';
    return `<div class="part" style="width:${w}%;background:${color}">${text}</div>`;
  }).join('')}</div>`;
}
function s03() {
  const none = !R.loss.by_who.length && !R.loss.by_how.length;
  const body = none ? '<p class="note">No bytes have been removed yet.</p>'
    : `<div class="panel"><div>who removed it</div>${stack(R.loss.by_who, WHO)}<div>how it was removed</div>${stack(R.loss.by_how, HOW)}<div class="k">shares of all removed bytes</div></div>`;
  return head('03', 'WHY IT DIES', 'Of the bytes that disappeared, who removed them and how. Human edits only show up when the editor extension is running.') + body;
}

function s04() {
  const cards = DIMS.map(([dim, title]) => {
    const g = R.slices.find(x => x.dimension === dim && x.anchor === state.anchor && x.horizon === state.hz);
    if (!g) return '';
    const rows = g.rows.map(r => `<div class="r ${r.spans < TOO_FEW ? 'few' : ''}"><div class="t"><span class="k">${esc(label(dim, r.label))}</span><span>${pct(r.retention)}</span></div><div class="track"><div class="fill" style="width:${Math.round(r.retention * 100)}%"></div></div><div class="sub">n=${count(r.spans)}${r.spans < TOO_FEW ? ' too few' : ''}</div></div>`).join('');
    return `<div class="card"><div class="chip">${title}</div>${rows}</div>`;
  }).join('');
  const body = cards ? `<div class="slices">${cards}</div>` : '<p class="note">No slices for this age yet.</p>';
  return head('04', 'SLICES', `Retention at the chosen age, split by how the code was written. Bars are weighted by bytes, so big edits count more. Groups under 10 spans are marked too few. Showing ${state.anchor === 'commit' ? 'from commit' : 'from generation'} at ${state.hz}.`) + body;
}

function s05() {
  const g = R.examples.find(x => x.anchor === state.anchor && x.horizon === state.hz);
  const rows = g ? [['best', g.best], ['worst', g.worst]].flatMap(([tag, files]) => files.map(f => `<div class="ex"><span class="${tag}">${tag}</span><span class="p">${esc(f.file)}</span><span class="k">${bytes(f.total_bytes)}</span><span style="text-align:right">${pct(f.retention)}</span></div>`)).join('') : '';
  const body = rows ? `<div class="panel" style="padding:0">${rows}</div>` : '<p class="note">No file has 1 KB of AI code that old yet.</p>';
  return head('05', 'BEST AND WORST FILES', 'Files whose AI code lasted longest and shortest at the chosen age. Files under 1 KB of AI code are left out.') + body;
}

function s06() {
  const most = R.cost ? Math.max(...R.cost.map(c => c.dollars_per_surviving_kb)) : 0;
  const body = R.cost
    ? `<div class="panel">${R.cost.map(c => `<div class="blocks"><span>${esc(c.model)}</span><div class="bl">${Array.from({ length: Math.max(1, Math.round(c.dollars_per_surviving_kb / most * 21)) }, () => '<i></i>').join('')}</div><span style="text-align:right">$${c.dollars_per_surviving_kb.toFixed(3)}</span></div>`).join('')}</div>`
    : '<div class="card off">Not measured yet.</div>';
  return head('06', 'COST PER SURVIVING KB', "Dollars spent on a model's calls for each kilobyte of its code that survived.") + body;
}

function s07() {
  const q = R.quality;
  const items = [['captured', q.spans], ['committed', q.pinned], ['model known', q.linked], ['model unknown', q.unknown], ['waiting for a call', q.pending], ['no tool call', q.none]]
    .concat(R.horizons.filter(r => r.anchor === state.anchor).map(r => ['reached ' + r.horizon, r.spans]));
  return head('07', 'WHAT THIS RESTS ON', "How many spans each number comes from, and what the data can't see.")
    + `<div class="quality">${items.map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${count(v)}</div></div>`).join('')}</div>`
    + `<p class="note">Retention can read too high: a file deleted outside the editor, or edited where no checkpoint fired, still counts as surviving. 'Model unknown' means no matching Claude call was found (a non-Claude agent, or no transcript).</p>`;
}

function tween() {
  const el = document.getElementById('big');
  if (!el || el.dataset.target === '') return;
  const target = Number(el.dataset.target);
  if (reduce) { el.textContent = target + '%'; return; }
  const start = performance.now();
  const step = now => {
    const t = Math.min(1, (now - start) / 700);
    el.textContent = Math.round(target * t) + '%';
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const put = (id, html) => { document.getElementById(id).innerHTML = html; };
function renderChosen() {
  put('s01', s01());
  put('s04', s04());
  put('s05', s05());
  put('s07', s07());
  moveMark();
  tween();
}
put('s02', s02());
put('s03', s03());
put('s06', s06());
renderChosen();
setTimeout(() => document.getElementById('app').classList.add('settled'), 1200);

document.getElementById('app').addEventListener('click', e => {
  const t = e.target.closest('[data-hz],[data-anchor],[data-line]');
  if (!t) return;
  if (t.dataset.hz) { state.hz = t.dataset.hz; renderChosen(); }
  else if (t.dataset.anchor) { state.anchor = t.dataset.anchor; renderChosen(); }
  else if (t.dataset.line) {
    const a = t.dataset.line;
    state.show[a] = !state.show[a];
    const g = document.getElementById('line-' + a);
    if (g) g.style.opacity = state.show[a] ? 1 : .08;
    t.classList.toggle('on', state.show[a]);
  }
});
</script>
</body>
</html>
